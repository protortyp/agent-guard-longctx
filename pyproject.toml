[project]
name = "agent-guard-longctx"
version = "0.1.0"
description = "Long-context prompt injection & indirect agent-input guard with deterministic Unicode normalization and multi-runtime ONNX export"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface_hub>=0.28.0",
    "numpy>=2.0.0",
    "tokenizers>=0.21.0",
]

[project.optional-dependencies]
cpu = [
    "onnxruntime>=1.20.0",
]
cuda = [
    "onnxruntime-gpu>=1.20.0",
]
torch = [
    "torch>=2.6.0",
    "transformers>=4.48.0",
]
train = [
    "datasets>=3.0.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "safetensors>=0.4.5",
    "scikit-learn>=1.5.0",
    "torch>=2.6.0",
    "transformers>=4.48.0",
]

[dependency-groups]
dev = [
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "pytest>=8.0.0",
    "torch>=2.6.0",
    "transformers>=4.48.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
